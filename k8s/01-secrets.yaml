# Credenciales (Secrets). En un entorno real NO se versionan; aquí se incluyen
# para que el profesor pueda reproducir el despliegue.
apiVersion: v1
kind: Secret
metadata: {name: postgres-data-secret, namespace: mlops}
type: Opaque
stringData:
  POSTGRES_USER: datauser
  POSTGRES_PASSWORD: datapass
  POSTGRES_DB: datadb
  DATA_DB_URI: postgresql+psycopg2://datauser:datapass@postgres-data:5432/datadb
  DATA_DB_DSN: postgresql://datauser:datapass@postgres-data:5432/datadb
---
apiVersion: v1
kind: Secret
metadata: {name: postgres-meta-secret, namespace: mlops}
type: Opaque
stringData:
  POSTGRES_USER: metauser
  POSTGRES_PASSWORD: metapass
  POSTGRES_DB: metadb
  MLFLOW_BACKEND_URI: postgresql://metauser:metapass@postgres-meta:5432/mlflowdb
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://metauser:metapass@postgres-meta:5432/airflowdb
---
apiVersion: v1
kind: Secret
metadata: {name: minio-secret, namespace: mlops}
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123
---
apiVersion: v1
kind: Secret
metadata: {name: airflow-secret, namespace: mlops}
type: Opaque
stringData:
  AIRFLOW__WEBSERVER__SECRET_KEY: proyecto2-mlops-secret-key
  _AIRFLOW_ADMIN_USER: admin
  _AIRFLOW_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: Secret
metadata: {name: grafana-secret, namespace: mlops}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
