apiVersion: v1
kind: ConfigMap
metadata: {name: locust-config, namespace: mlops}
data:
  LOCUST_HOST: http://inference-api:8000
  LOCUST_LOCUSTFILE: /home/locust/locustfile.py
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: locust, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: locust}}
  template:
    metadata: {labels: {app: locust}}
    spec:
      containers:
        - name: locust
          image: DOCKERHUB_USER/p2-locust:1.0
          envFrom: [{configMapRef: {name: locust-config}}]
          ports: [{containerPort: 8089}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: 8089}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8089}
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: {name: locust, namespace: mlops}
spec:
  type: NodePort
  selector: {app: locust}
  ports: [{port: 8089, targetPort: 8089, nodePort: 30889}]
