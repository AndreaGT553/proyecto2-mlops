# Airflow (LocalExecutor) en un solo pod: webserver + scheduler.
# Metadatos en postgres-meta/airflowdb (separados de los datos del proyecto).
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: mlops
data:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW__CORE__PARALLELISM: '4'
  AIRFLOW__WEBSERVER__WORKERS: '2'
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '30'
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT: diabetes_readmission
  MODEL_NAME: diabetes-readmission
  MODEL_ALIAS: champion
  SOURCE_FILE: /opt/airflow/data/diabetic_data.csv
  BATCH_SIZE: '15000'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      initContainers:
      - name: wait-db
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - until pg_isready -h postgres-meta -p 5432 && pg_isready -h postgres-data -p 5432; do sleep 3; done
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - name: airflow-init
        image: DOCKERHUB_USER/p2-airflow:1.0
        envFrom:
        - configMapRef:
            name: airflow-config
        - secretRef:
            name: airflow-secret
        - secretRef:
            name: postgres-meta-secret
        env:
        - name: DATA_DB_URI
          valueFrom:
            secretKeyRef:
              name: postgres-data-secret
              key: DATA_DB_URI
        command:
        - bash
        - -c
        args:
        - airflow db migrate && (airflow users create --username $_AIRFLOW_ADMIN_USER --password $_AIRFLOW_ADMIN_PASSWORD --firstname Admin --lastname MLOps --role Admin --email admin@example.com || true)
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
      containers:
      - name: webserver
        image: DOCKERHUB_USER/p2-airflow:1.0
        args:
        - webserver
        envFrom:
        - configMapRef:
            name: airflow-config
        - secretRef:
            name: airflow-secret
        - secretRef:
            name: postgres-meta-secret
        env:
        - name: DATA_DB_URI
          valueFrom:
            secretKeyRef:
              name: postgres-data-secret
              key: DATA_DB_URI
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
      - name: scheduler
        image: DOCKERHUB_USER/p2-airflow:1.0
        args:
        - scheduler
        envFrom:
        - configMapRef:
            name: airflow-config
        - secretRef:
            name: airflow-secret
        - secretRef:
            name: postgres-meta-secret
        env:
        - name: DATA_DB_URI
          valueFrom:
            secretKeyRef:
              name: postgres-data-secret
              key: DATA_DB_URI
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - airflow jobs check --job-type SchedulerJob --local
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 30
        volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
        - name: work
          mountPath: /opt/airflow/tmp
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: airflow-logs-pvc
      - name: work
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs-pvc
  namespace: mlops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: mlops
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
