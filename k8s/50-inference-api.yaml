apiVersion: v1
kind: ConfigMap
metadata: {name: api-config, namespace: mlops}
data:
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: diabetes-readmission
  MODEL_ALIAS: champion
  MODEL_REFRESH_SECONDS: "60"
  PREDICTION_THRESHOLD: "0.5"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inference-api, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: inference-api}}
  template:
    metadata:
      labels: {app: inference-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: DOCKERHUB_USER/p2-inference-api:1.0
          envFrom: [{configMapRef: {name: api-config}}]
          env:
            - name: DATA_DB_DSN
              valueFrom: {secretKeyRef: {name: postgres-data-secret, key: DATA_DB_DSN}}
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: inference-api, namespace: mlops}
spec:
  type: NodePort
  selector: {app: inference-api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30800}]
