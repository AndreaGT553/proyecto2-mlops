# MinIO: almacén de objetos (artefactos de MLflow)
# Desde oct-2025 MinIO ya no publica imágenes gratuitas en Docker Hub;
# se usa la imagen gratuita mantenida por Chainguard.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-pvc, namespace: mlops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: mlops}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      securityContext: {fsGroup: 65532}
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom: [{secretRef: {name: minio-secret}}]
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-pvc}
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: mlops}
spec:
  type: NodePort
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001, nodePort: 30901}