apiVersion: v1
kind: ConfigMap
metadata: {name: ui-config, namespace: mlops}
data:
  API_URL: http://inference-api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: streamlit-ui, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: streamlit-ui}}
  template:
    metadata: {labels: {app: streamlit-ui}}
    spec:
      containers:
        - name: ui
          image: andregt553/p2-streamlit-ui:1.0
          envFrom: [{configMapRef: {name: ui-config}}]
          ports: [{containerPort: 8501}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: streamlit-ui, namespace: mlops}
spec:
  type: NodePort
  selector: {app: streamlit-ui}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30851}]
