# MLflow: backend PostgreSQL (postgres-meta/mlflowdb) + artefactos en MinIO.
# --serve-artifacts: los clientes (Airflow, API) suben/bajan artefactos a través
# del servidor, así sólo MLflow necesita las credenciales de MinIO.
apiVersion: v1
kind: ConfigMap
metadata: {name: mlflow-config, namespace: mlops}
data:
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  ARTIFACT_BUCKET: mlflow-artifacts
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      initContainers:
        - name: create-bucket   # crea el bucket en MinIO si no existe
          image: minio/mc:RELEASE.2024-11-21T17-21-54Z
          envFrom:
            - secretRef: {name: minio-secret}
            - configMapRef: {name: mlflow-config}
          command: ["sh", "-c"]
          args:
            - until mc alias set local $MLFLOW_S3_ENDPOINT_URL $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do echo esperando minio; sleep 3; done;
              mc mb --ignore-existing local/$ARTIFACT_BUCKET
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
        - name: wait-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres-meta -p 5432; do echo esperando postgres-meta; sleep 3; done"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: mlflow
          image: andregt553/p2-mlflow:1.0
          envFrom:
            - secretRef: {name: minio-secret}
            - configMapRef: {name: mlflow-config}
          env:
            - name: MLFLOW_BACKEND_URI
              valueFrom: {secretKeyRef: {name: postgres-meta-secret, key: MLFLOW_BACKEND_URI}}
          command: ["sh", "-c"]
          args:
            - mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri $MLFLOW_BACKEND_URI
              --artifacts-destination s3://$ARTIFACT_BUCKET
              --serve-artifacts --workers 2
          ports: [{containerPort: 5000}]
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlops}
spec:
  type: NodePort
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
